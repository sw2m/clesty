openapi: 3.0.3
info:
  title: Schema $ref — chain ($ref -> $ref)
  version: 0.0.1
paths:
  /pets:
    get:
      operationId: getPet
      responses:
        "200":
          description: A pet via a ref-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetAlias"
components:
  schemas:
    PetAlias:
      $ref: "#/components/schemas/Pet"
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
