openapi: 3.1.0
info:
  title: Schema $ref — 3.1 sibling
  version: 0.0.1
paths:
  /pets:
    get:
      operationId: getPet
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
                description: This sibling MUST surface on 3.1 as a doc comment.
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
