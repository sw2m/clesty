openapi: 3.1.0
info:
  title: 4xx Routing
  version: 0.0.1
paths:
  /thing:
    get:
      operationId: getThing
      responses:
        "2XX":
          description: any 2xx
          content:
            application/json:
              schema:
                type: object
        "4XX":
          description: any 4xx
          content:
            application/json:
              schema:
                type: object
        default:
          description: fallback
          content:
            application/json:
              schema:
                type: object
