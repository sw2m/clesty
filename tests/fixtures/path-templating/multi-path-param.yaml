openapi: 3.1.0
info:
  title: Path templating — multiple path params
  version: 0.0.1
paths:
  /users/{id}/orders/{orderId}:
    get:
      operationId: getUserOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: An order
          content:
            application/json:
              schema:
                type: object
